modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Itamio, CorgiTaco"
description="Removes client side entity collision checks, which boosts FPS. Fixes https://bugs.mojang.com/browse/MC-228976. Unofficial NeoForge port for Minecraft 1.21.11 of the \"Entity Collision FPS Fix\" by CorgiTaco (CC0-1.0). Code updated to 1.21.11 by Itamio. See NOTICE for credit and licensing details."

[[mixins]]
config="entitycollision.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
